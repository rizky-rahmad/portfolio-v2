name: CI

# Advisory CI: build-test + demo audit on every PR and push. Nothing gates on
# it — main is not branch-protected (solo-dev repo) and every push to main
# auto-deploys via Cloudflare, whose own build typechecks
# (ignoreBuildErrors: false). A red CI is a signal to fix, not a locked door.
#
# Pushes that only touch content/resume.json (the hourly sync bot) skip this
# workflow via paths-ignore below: data-only changes need no 8-minute audit.

on:
  pull_request:
  push:
    paths-ignore:
      - "content/resume.json"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # playwright-core ships no browser. Install the chromium build from
      # the matching playwright release — keep this minor version in sync
      # with the playwright-core devDependency when bumping it.
      - run: npx -y playwright@1.64 install --with-deps chromium

      - name: Start the dev server
        run: |
          npm run dev -- --port 3000 > /tmp/dev.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/demos > /dev/null; then break; fi
            sleep 5
          done
          curl -sf http://localhost:3000/demos > /dev/null

      - run: npm run demo:audit
