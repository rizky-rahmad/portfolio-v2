name: Sync resume from Google Docs

# Rizky updates the resume by pasting into the Google Doc, so nothing here should
# need a human. This job notices the change, transcribes it once, and lands the
# result on main through a bot PR with auto-merge — Cloudflare Pages then
# deploys it like any other merge.
#
# Design notes (do not "simplify" back to a direct push without re-reading):
#  - main is protected (PR + green build-test/audit required). The bot has no
#    bypass and no extra secrets: it pushes to bot/resume-sync (unprotected)
#    with GITHUB_TOKEN and merges through the normal PR flow, so every
#    transcription passes full CI before reaching production.
#  - Failure modes: unchanged doc -> exit 0, no PR. Transcribe/fetch failure
#    -> loud workflow failure (email). Red CI -> PR stays open for manual
#    inspection; the next run updates the same branch. allow_auto_merge must
#    stay enabled on the repo or `gh pr merge --auto` fails loudly.
#  - GitHub disables scheduled workflows after 60 days without repo activity.
#    If the resume silently stops updating, re-enable it on the Actions tab.
#  - Schedules only run from the default branch, so this does nothing until it
#    is merged into main.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: # "Run workflow" button, for when you want it live now

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-resume
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Transcribe the resume if it changed
        run: node scripts/sync-resume.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}

      - name: Open or update the sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- content/resume.json; then
            echo "Nothing changed — no PR."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin bot/resume-sync 2>/dev/null || true
          git checkout -B bot/resume-sync
          git add content/resume.json
          git commit -m "chore: sync resume from Google Docs"
          # bot-owned branch on unprotected ref: force-push is safe, and the
          # concurrency group serializes runs so there is a single writer.
          git push --force-with-lease origin bot/resume-sync
          PR=$(gh pr list --head bot/resume-sync --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            # NOTE: `gh pr create` on these runners has no --json flag; the
            # create prints the PR URL, then `gh pr view` reads the number.
            gh pr create --head bot/resume-sync --base main \
              --title "chore: sync resume from Google Docs" \
              --body "Automated transcription of the Google Doc resume. Auto-merges when CI is green; if CI stays red, inspect manually."
            PR=$(gh pr view bot/resume-sync --json number --jq '.number')
            echo "Opened PR #$PR"
          else
            echo "Updated existing PR #$PR"
          fi
          # Idempotent: enabling auto-merge on an already-pending PR is a no-op.
          gh pr merge --auto --squash --delete-branch "$PR"
