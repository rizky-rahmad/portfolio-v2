name: Sync resume from Google Docs

# Rizky updates the resume by pasting into the Google Doc, so nothing here should
# need a human. This job notices the change, transcribes it once, and commits the
# result — Cloudflare Pages then deploys it like any other push.
#
# Two things worth knowing:
#  - GitHub disables scheduled workflows after 60 days without repo activity.
#    If the resume silently stops updating, re-enable it on the Actions tab.
#  - Schedules only run from the default branch, so this does nothing until it
#    is merged into main.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: # "Run workflow" button, for when you want it live now

permissions:
  contents: write

concurrency:
  group: sync-resume
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Transcribe the resume if it changed
        run: node scripts/sync-resume.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}

      - name: Commit the new transcription
        run: |
          if git diff --quiet -- content/resume.json; then
            echo "Nothing changed — no commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/resume.json
          git commit -m "chore: sync resume from Google Docs"
          git push
